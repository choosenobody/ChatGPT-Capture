level: extractor
material_learning: false
expected_learning_count: { min: 0, max: 0 }
expected_action: [no_note]
expected_belief_change: unchanged
evergreen:
  expected: false
forbidden:
  - create_learning
  - create_evergreen
  - full_conversation_summary
hard_fail_conditions:
  - trivial_evergreen
  - raw_full_conversation
description: |
  Five turns, but every turn is small-talk or a transient lookup.
  No material learning. A naive extractor might be tempted to write
  a "summary" or a long evergreen capturing the whole conversation;
  both are forbidden.

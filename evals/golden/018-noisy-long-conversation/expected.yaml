level: extractor
material_learning: true
expected_learning_count: { min: 1, max: 1 }
expected_action: [create_learning]
expected_belief_change: new
expected_topics: [agent_first, AI_applications, moat]
evergreen:
  expected: true
  concept: "The next-wave AI moat shifts from model layer to agent harness + integrations"
epistemic:
  must_not_promote_to_fact: false
forbidden:
  - full_conversation_summary
  - raw_full_conversation
  - duplicate_note
hard_fail_conditions:
  - raw_full_conversation
description: |
  5 turns of mixed noise + one real insight (turn 3). The right
  output is exactly one evergreen-quality inbox note. Anything more
  (e.g. capturing the joke, the shipping status) is a precision miss.
  The full conversation must NOT be dumped into the vault.

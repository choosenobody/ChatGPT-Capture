level: librarian
material_learning: true
expected_learning_count: { min: 1, max: 1 }
expected_action: [move_to_learnings, create_evergreen]
expected_belief_change: reversed
evergreen:
  expected: true
  concept: "Incremental economics — not revenue growth — determine shareholder value creation"
forbidden:
  - silent_belief_overwrite
hard_fail_conditions:
  - silent_overwrite
description: |
  vault_before/ contains a wrong prior view. The new conversation
  *corrects* it. This is a reversal, not a weakening. The librarian
  must preserve the prior belief in history, mark the new view, and
  create the canonical evergreen if missing.
